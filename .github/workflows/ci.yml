name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.10 = oldest supported (install.sh bootstraps 3.12 via uv when older)
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile check
        run: python -m compileall -q agent.py webui.py self_edit.py platform_compat.py keep_running.py broker_events.py rules.py transfer.py llm_policy.py lightning_wallet.py notifications.py provision.py brokers sources
      - name: Tests
        run: pytest
